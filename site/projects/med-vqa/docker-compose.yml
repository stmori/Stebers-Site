# Med-VQA: two containers. `web` = Caddy (HTTPS + static site + /api proxy), `api` = FastAPI + ChromaDB.
# Local test:  DOMAIN=":80" in .env, then  docker compose up --build   ->  http://localhost
# Production:  DOMAIN="yourdomain.tech, www.yourdomain.tech" in .env   ->  https://yourdomain.tech
services:
  web:
    build:
      context: .
      dockerfile: ${WEB_DOCKERFILE:-frontend/Dockerfile}   # set WEB_DOCKERFILE=deploy/web-fallback.Dockerfile for the backup UI
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data        # TLS certificates; keep this volume or Let's Encrypt has to reissue
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    volumes:
      - ./index:/index:ro       # unpacked index_medquad (index_info.json + chroma.sqlite3 + ...)
    expose:
      - "8000"
    restart: unless-stopped

volumes:
  caddy_data: {}
  caddy_config: {}
